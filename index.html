<!DOCTYPE html>
<!-- USANDO A VERSÃO MAIS NOVA DO HTML -->

<!-- language - idioma / lingua -->
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2025/09/23/10/20250923105104-0TPCNSWD.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="1style.css" />
  <title>StarBackS DevClub</title>
</head>

<body>
  <div class="main">
    <div class="circulo"></div>

    <img src="img/logo.png" alt="Logo StarBackS" class="logo" />

    <div class="caixa-conteudo">
      <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          ">
        <div class="caixa-textos">
          <h2>
            It's not just coffee It's
            <span class="texto-starbacks">StarBackS</span>
          </h2>
          <p class="paragrafo">
            Bem-vindo ao StarBackS DevClub, onde a paixão por café se encontra
            com a inovação tecnológica!
          </p>
          <button>Clique no Sininho</button>
        </div>
      </div>

      <div class="caixa-imagem">
        <img src="img/img1.png" alt="Copo starbacks" class="imagem-copo" />
      </div>
    </div>
    <div class="caixa-menu">
      <img src="img/thumb1.png" alt="Copo botao" class="botao-menu" onclick="mudar('#017143', 'img1.png')" />
      <img src="img/thumb2.png" alt="Copo botao" class="botao-menu" onclick="mudar('#eb7495', 'img2.png')" />
      <img src="img/thumb3.png" alt="Copo botao" class="botao-menu" onclick="mudar('#d752b1', 'img3.png')" />
    </div>
  </div>
  <!-- FECHANDO caixa-conteudo AQUI -->
</body>
<script src="scripts.js"></script>

</html>
