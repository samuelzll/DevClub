<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Controle Mensal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- AUTH BAR (topo) -->
<div id="authBar" style="display:none" class="auth-bar">
    <span id="userEmail"></span>
    <button onclick="logout()">Sair</button>
</div>

<!-- LOGIN -->
<div class="login" id="loginBox">
    <p> Aqui voçe controla suas finanças</p>
    <input id="email" type="email" placeholder="email">
    <input id="senha" type="password" placeholder="senha">

    <button onclick="login()">Entrar</button>
    <button onclick="registrar()">Criar conta</button>
</div>


<!-- CONTEÚDO PROTEGIDO -->
<div id="appContent" style="display:none">
    <!-- TODO O RESTO DO SEU SITE FICA AQUI DENTRO -->

  


<div class="topo">
    <label>Mês:
        <input type="month" id="mes">
    </label>

    <label>Valor de Entrada R$:
        <input type="number" id="entrada">
    </label>
</div>

<div class="conteudo">

    <!-- CARTÃO -->
    <div class="coluna">
        <h2>Cartão de credito</h2>

        <input id="ccDesc" placeholder="descrição">
        <input id="ccValor" type="number" placeholder="valor" required min="0" step="0.01">

        <select id="ccParcela">
            <option value="1">À vista</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="6">6x</option>
            <option value="7">7x</option>
            <option value="8">8x</option>
            <option value="9">9x</option>
            <option value="10">10x</option>
            <option value="11">11x</option>
            <option value="12">12x</option>
        </select>


        <button onclick="addCredito()">add</button>

        <div id="listaCredito"></div>

        <div class="total">
            Total cartão: <span id="totalCredito">R$ 0,00</span>
        </div>
    </div>

    <!-- DEMAIS -->
    <div class="coluna">
        <h2>Outros gastos:</h2>

        <input id="dDesc" placeholder="descrição">
        <input id="dValor" type="number" placeholder="valor">

        <select id="dParcela">
            <option value="1">À vista</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="6">6x</option>
            <option value="7">7x</option>
            <option value="8">8x</option>
            <option value="9">9x</option>
            <option value="10">10x</option>
            <option value="11">11x</option>
            <option value="12">12x</option>
        </select>

        <button onclick="addDemais()">add</button>

        <div id="listaDemais"></div>

        <div class="total">
            Total de Outros: <span id="totalDemais">R$ 0,00</span>
        </div>
    </div>

</div>

<div class="soma-final">
  <div class="total-soma">  Soma total : <span id="somaTotal">R$ 0,00 </span><br> </div> 
  <div class="final-saldo">   Saldo final: <span id="saldoFinal">R$ 0,00</span> </div> 
</div>

<div class="exportar">
    <button onclick="exportarPDF()">📄 Exportar PDF</button>
    <button onclick="exportarExcel()">📊 Exportar Excel</button>
</div>


<div class="grafico">
    <canvas id="graficoMensal"></canvas>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


<script src="scripts.js"></script>
</div>
</body>
</html>
